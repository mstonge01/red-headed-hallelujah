<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Red-Headed Hallelujah</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Staatliches&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json?v=3">
    <meta name="theme-color" content="#EF4444">
    
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .font-album-title { font-family: 'Staatliches', cursive; }

        /* Scrollbars */
        #playlist::-webkit-scrollbar, #video-playlist::-webkit-scrollbar, #flipper-back::-webkit-scrollbar { width: 8px; }
        #playlist::-webkit-scrollbar-track, #video-playlist::-webkit-scrollbar-track, #flipper-back::-webkit-scrollbar-track { background: #374151; border-radius: 10px; }
        #playlist::-webkit-scrollbar-thumb, #video-playlist::-webkit-scrollbar-thumb, #flipper-back::-webkit-scrollbar-thumb { background: #EF4444; border-radius: 10px; }

        /* Playlist Items */
        .playlist-item.active { background-color: #EF4444; color: #FFFFFF; }
        .playlist-item.dj-track { background-color: #374151; }
        .playlist-item.dj-track.active { background-color: #EF4444; }
        .dj-track .track-artist { color: #FBBF24; font-size: 0.8rem; }

        /* Range Slider */
        #progress-bar-container input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: #EF4444; border-radius: 3px; cursor: pointer; margin-top: -6px; }
        #progress-bar-container input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: #4B5563; outline: none; }

        /* Texture & Animation */
        .player-texture { background-color: #1F2937; background-image: url('https://www.transparenttextures.com/patterns/stucco.png'); }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); } 50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.7); } }
        .is-playing-glow { animation: pulseGlow 2.5s infinite ease-in-out; }

        /* Flipper */
        .flipper-container { perspective: 1000px; padding-top: 100%; }
        #flipper { transform-style: preserve-3d; transition: transform 0.8s; }
        #flipper.is-flipped { transform: rotateY(180deg); }
        .flipper-front, .flipper-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        #flipper-back { transform: rotateY(180deg); background-color: #4B5563; background-image: url('https://www.transparenttextures.com/patterns/concrete-wall.png'); }
        
        /* Crossfade */
        #song-art { transition: opacity 0.5s ease-in-out; opacity: 0; }
        #song-art.is-visible { opacity: 1; }

        /* Splash Screen UI */
        #enter-btn { background: rgba(239, 68, 68, 0.9); border: 2px solid rgba(255, 255, 255, 0.5); transition: all 0.3s ease; }
        #enter-btn:hover { background: rgba(220, 38, 38, 1); transform: scale(1.05); }
        #skip-intro-btn { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.3); }
        
        /* Lyrics */
        #lyrics-container { font-family: 'Staatliches', cursive; font-size: 1.5rem; line-height: 2rem; letter-spacing: 0.05em; text-align: center; }
        .lyric-line { transition: all 0.3s ease-in-out; opacity: 0.4; padding: 4px 8px; transform: scale(0.95); }
        .lyric-line.active-lyric { opacity: 1; color: #FBBF24; background: rgba(17, 24, 39, 0.4); transform: scale(1); }
        
        /* DJ Toggle */
        #dj-mode-toggle:checked + label { background-color: #EF4444; }
        #dj-mode-toggle:checked + label span { transform: translateX(24px); }

        /* Loader */
        .loader { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #EF4444; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Progress Bar for Downloads */
        .download-bar-bg { background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; height: 8px; width: 200px; margin-top: 10px; }
        .download-bar-fill { background: #EF4444; height: 100%; width: 0%; transition: width 0.2s ease; }
    </style>
</head>
<body class="bg-gray-900 text-gray-300 min-h-screen flex items-center justify-center p-4 select-none">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed top-0 left-0 w-full h-full bg-gray-900 z-50 flex items-center justify-center opacity-100 transition-opacity duration-1000">
        <video id="splash-video" class="max-w-full max-h-full object-contain" preload="auto" playsinline>
            <source src="paint-video.mp4" type="video/mp4">
        </video>
        
        <div class="absolute inset-0 flex flex-col items-center justify-center bg-black/40">
            <div id="update-status" class="p-4 rounded-lg text-white font-album-title text-2xl tracking-wider animate-pulse">
                Checking for Updates...
            </div>
            
            <div id="download-progress-container" class="hidden flex-col items-center">
                <div class="download-bar-bg"><div id="download-bar-fill" class="download-bar-fill"></div></div>
                <p id="download-percent" class="text-gray-400 text-sm mt-2 font-mono">0%</p>
            </div>

            <button id="enter-btn" class="hidden mt-6 z-60 text-white p-5 px-10 font-album-title text-2xl tracking-widest rounded-lg shadow-2xl uppercase">Push to Start</button>
        </div>
        <button id="skip-intro-btn" class="hidden absolute bottom-10 left-1/2 -translate-x-1/2 z-60 text-white px-6 py-3 bg-gray-800/80 rounded-full text-sm font-bold tracking-wide border border-white/20 backdrop-blur-sm">Skip Intro</button>
    </div>

    <!-- Main Player Container -->
    <div id="player-container" class="w-full max-w-4xl opacity-0 transition-opacity duration-1000">
        <div class="player-texture shadow-2xl overflow-hidden flex flex-col md:flex-row rounded-xl border border-gray-800">
            
            <!-- Left Side -->
            <div class="w-full md:w-1/2 flex-shrink-0 flex flex-col">
                <div class="relative w-full flipper-container bg-black"> 
                    <div id="video-panel" class="absolute top-0 left-0 w-full h-full z-20 hidden">
                        <iframe id="video-iframe" class="w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                    <div id="flipper" class="absolute top-0 left-0 w-full h-full z-10">
                        <div class="flipper-front absolute w-full h-full">
                            <img src="cover.png" alt="Album Art" class="w-full h-full object-cover">
                            <img id="song-art" src="" alt="Song Art" class="absolute top-0 left-0 w-full h-full object-cover">
                        </div>
                        <div id="flipper-back" class="flipper-back absolute w-full h-full p-6 overflow-y-auto">
                            <div id="lyrics-container" class="text-gray-200 space-y-2"></div>
                        </div>
                    </div>
                </div>
                <div class="flex">
                    <button id="lyrics-btn" class="flex-1 bg-red-500 text-white font-album-title tracking-wider text-lg p-3 hover:bg-red-600 transition">Lyrics</button>
                    <button id="about-btn" class="flex-1 bg-gray-600 text-white font-album-title tracking-wider text-lg p-3 hover:bg-gray-700 transition border-l border-gray-800">About</button>
                </div>
            </div>

            <!-- Right Side -->
            <div class="w-full md:w-1/2 p-6 flex flex-col">
                <div class="mb-4 flex-shrink-0">
                    <p class="text-lg uppercase tracking-widest text-red-500 font-album-title">Now Playing</p>
                    <h2 id="song-title" class="text-3xl text-yellow-400 truncate font-album-title tracking-wider">Song Title</h2>
                    <h3 id="song-artist" class="text-lg text-gray-300">A mstonge01 Project</h3>
                </div>

                <div class="mb-4 flex-shrink-0">
                    <div id="progress-bar-container" class="mb-3">
                         <input type="range" id="progress-bar" class="w-full h-1 bg-gray-700 rounded-lg cursor-pointer" value="0" min="0" max="100">
                    </div>
                    <div class="flex justify-between text-sm text-gray-400">
                        <span id="current-time">0:00</span>
                        <span id="duration-time">0:00</span>
                    </div>

                    <div class="flex justify-center items-center space-x-6 mt-4">
                        <button id="prev-btn" class="text-gray-400 hover:text-red-500 transition p-2"><svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path d="M8.445 14.832A1 1 0 0010 14.03V5.969a1 1 0 00-1.555-.832L4.12 9.168a1 1 0 000 1.664l4.325 4zM10.879 9.168a1 1 0 000 1.664l4.325 4A1 1 0 0017 14.03V5.969a1 1 0 00-1.555-.832l-4.325 4z"/></svg></button>
                        <div class="relative">
                            <button id="play-pause-btn" class="w-20 h-20 bg-red-500 text-white rounded-full flex items-center justify-center text-2xl hover:bg-red-600 transition shadow-lg ring-4 ring-gray-800">
                                <svg id="play-icon" class="w-10 h-10 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8.002v3.996a1 1 0 001.555.832l3.197-1.998a1 1 0 000-1.664l-3.197-1.998z" clip-rule="evenodd"/></svg>
                                <svg id="pause-icon" class="w-10 h-10 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h1a1 1 0 001-1V8a1 1 0 00-1-1h-1z" clip-rule="evenodd"/></svg>
                            </button>
                            <div id="loading-spinner" class="absolute top-0 left-0 w-full h-full flex items-center justify-center bg-gray-900/50 rounded-full hidden"><div class="loader"></div></div>
                        </div>
                        <button id="next-btn" class="text-gray-400 hover:text-red-500 transition p-2"><svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path d="M4.555 5.168A1 1 0 003 5.969v8.062a1 1 0 001.555.832l4.325-4a1 1 0 000-1.664l-4.325-4zM10.879 5.168A1 1 0 009.324 5.97v8.062a1 1 0 001.555.832l4.325-4a1 1 0 000-1.664l-4.325-4z"/></svg></button>
                    </div>
                </div>
                
                <div class="flex-grow flex flex-col min-h-0">
                    <div class="flex-shrink-0 flex justify-between items-center border-b-2 border-gray-700 pb-2">
                        <div class="flex space-x-1">
                            <button id="audio-tab" class="px-4 py-2 font-album-title tracking-wider text-lg rounded-t-lg transition bg-gray-700 text-white">Audio</button>
                            <button id="video-tab" class="px-4 py-2 font-album-title tracking-wider text-lg rounded-t-lg transition bg-transparent text-gray-500 hover:bg-gray-800">Video</button>
                        </div>
                        <div id="dj-mode-container" class="flex items-center space-x-2 px-2">
                            <label for="dj-mode-toggle" class="font-album-title text-gray-400 text-lg tracking-wider select-none cursor-pointer">DJ</label>
                            <input type="checkbox" id="dj-mode-toggle" class="hidden">
                            <label for="dj-mode-toggle" class="w-10 h-5 bg-gray-600 rounded-full flex items-center p-0.5 cursor-pointer transition duration-300"><span class="w-4 h-4 bg-white rounded-full transition-transform duration-300 transform translate-x-0"></span></label>
                        </div>
                    </div>
                    <div class="flex-grow relative min-h-0 h-64 md:h-auto bg-gray-800/50 rounded-b-lg">
                        <div id="playlist" class="absolute top-0 left-0 w-full h-full overflow-y-auto p-2 space-y-1"></div>
                        <div id="video-playlist" class="absolute top-0 left-0 w-full h-full overflow-y-auto p-2 space-y-1 hidden"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-player" preload="metadata"></audio>
    <audio id="intro-audio" src="hallelujah-intro.mp3" preload="auto"></audio>

    <!-- LOAD TRACKS DATABASE -->
    <script src="tracks.js"></script>

    <script>
        const CURRENT_VERSION = '2.4'; 

        // --- STATE MANAGEMENT (Feature #2) ---
        const playerState = {
            playlist: [],
            currentIndex: 0,
            isPlaying: false,
            view: 'lyrics',
            lyrics: [],
            lyricIndex: -1,
            hasInteracted: false
        };

        // --- HAPTIC FEEDBACK HELPER (Feature #7) ---
        function vibrate() {
            // Small 10ms tick for UI feedback
            if (navigator.vibrate) navigator.vibrate(10);
        }

        // --- WAKE LOCK MANAGER (Feature #4) ---
        let wakeLock = null;
        async function toggleWakeLock(shouldLock) {
            if (shouldLock) {
                try {
                    if (!wakeLock && 'wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        console.log('Wake Lock active');
                    }
                } catch (err) {
                    console.warn('Wake Lock error:', err);
                }
            } else {
                if (wakeLock) {
                    await wakeLock.release();
                    wakeLock = null;
                    console.log('Wake Lock released');
                }
            }
        }

        // Re-acquire lock if user minimizes and comes back
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                toggleWakeLock(true);
            }
        });


        // --- AUTOMATIC ASSET CHECKER ---
        async function performStartupCheck() {
            const statusEl = document.getElementById('update-status');
            const progressContainer = document.getElementById('download-progress-container');
            const progressBar = document.getElementById('download-bar-fill');
            const progressText = document.getElementById('download-percent');
            const enterBtn = document.getElementById('enter-btn');
            
            const savedVersion = localStorage.getItem('app_version');
            const isUpdate = savedVersion !== CURRENT_VERSION;
            
            // Build file list from tracks.js data
            const filesToCheck = ['paint-video.mp4', 'hallelujah-intro.mp3', 'cover.png', 'tracks.js'];
            allTracks.forEach(t => {
                if(t.src) filesToCheck.push(t.src);
                if(t.image_src) filesToCheck.push(t.image_src);
                if(t.srt) filesToCheck.push(t.srt);
            });

            const uniqueFiles = [...new Set(filesToCheck)];
            const totalFiles = uniqueFiles.length;
            let loadedCount = 0;

            if (isUpdate) {
                statusEl.textContent = "New Content Found - Downloading Updates...";
                statusEl.classList.remove('animate-pulse');
                progressContainer.classList.remove('hidden');
            } else {
                statusEl.textContent = "Verifying Files...";
            }

            const cache = await caches.open('rhh-cache-v23'); // Match SW version

            for (const file of uniqueFiles) {
                try {
                    const fetchOptions = isUpdate ? { cache: 'reload' } : {};
                    const response = await fetch(file, fetchOptions);
                    if (response.ok) await cache.put(file, response.clone());
                } catch (e) { console.warn(`Failed to verify/download ${file}`, e); }

                loadedCount++;
                const percent = Math.round((loadedCount / totalFiles) * 100);
                if (isUpdate) {
                    progressBar.style.width = `${percent}%`;
                    progressText.textContent = `${percent}%`;
                }
            }

            localStorage.setItem('app_version', CURRENT_VERSION);
            statusEl.classList.add('hidden');
            progressContainer.classList.add('hidden');
            enterBtn.textContent = "PUSH TO START";
            enterBtn.classList.remove('hidden');
            enterBtn.disabled = false;
            document.getElementById('splash-video').load();
        }

        document.addEventListener('DOMContentLoaded', () => {
            performStartupCheck();
            
            // DOM Elements
            const splashScreen = document.getElementById('splash-screen');
            const splashVideo = document.getElementById('splash-video');
            const enterBtn = document.getElementById('enter-btn');
            const skipIntroBtn = document.getElementById('skip-intro-btn');
            const playerContainer = document.getElementById('player-container');
            const audioPlayer = document.getElementById('audio-player');
            const introAudio = document.getElementById('intro-audio');
            const songTitleEl = document.getElementById('song-title');
            const songArtistEl = document.getElementById('song-artist');
            const playlistEl = document.getElementById('playlist');
            const videoPlaylistEl = document.getElementById('video-playlist');
            const audioTab = document.getElementById('audio-tab');
            const videoTab = document.getElementById('video-tab');
            const djModeToggle = document.getElementById('dj-mode-toggle');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const loadingSpinner = document.getElementById('loading-spinner');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');
            const lyricsBtn = document.getElementById('lyrics-btn');
            const aboutBtn = document.getElementById('about-btn');
            const flipper = document.getElementById('flipper');
            const lyricsContainerEl = document.getElementById('lyrics-container');
            const songArtEl = document.getElementById('song-art');
            const mainPlayerDiv = document.querySelector('.player-texture');
            const videoPanel = document.getElementById('video-panel');
            const videoIframe = document.getElementById('video-iframe');
            
            // --- Audio Handlers ---
            audioPlayer.addEventListener('waiting', () => loadingSpinner.classList.remove('hidden'));
            audioPlayer.addEventListener('playing', () => {
                loadingSpinner.classList.add('hidden');
                playerState.isPlaying = true;
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                mainPlayerDiv.classList.add('is-playing-glow');
                songArtEl.classList.add('is-visible');
                // Enable Wake Lock when playing
                toggleWakeLock(true);
            });
            audioPlayer.addEventListener('pause', () => {
                 // Release Wake Lock on pause
                 toggleWakeLock(false);
            });

            function startVideoTransition() {
                if(playerState.hasInteracted) return;
                playerState.hasInteracted = true;
                vibrate();
                enterBtn.classList.add('hidden');
                skipIntroBtn.classList.remove('hidden'); 
                const vidPromise = splashVideo.play();
                if (vidPromise !== undefined) {
                    vidPromise.catch(() => introAudio.play().catch(e => transitionToPlayer()));
                }
            }

            function skipIntro() {
                vibrate();
                splashVideo.pause();
                introAudio.pause(); 
                transitionToPlayer(); 
            }

            function transitionToPlayer() {
                skipIntroBtn.classList.add('hidden'); 
                splashScreen.style.opacity = '0';
                playerContainer.style.opacity = '1';
                setTimeout(() => splashScreen.style.display = 'none', 1000); 
            }

            function loadSong(track) {
                if (!track) return;
                loadingSpinner.classList.add('hidden');
                songTitleEl.textContent = track.title;
                songArtistEl.textContent = track.type === 'dj' ? djArtistName : artistName;
                audioPlayer.src = track.src;
                audioPlayer.currentTime = 0; 
                songArtEl.src = track.image_src; 
                songArtEl.classList.remove('is-visible'); 
                if (!videoPanel.classList.contains('hidden')) showVideoPanel(false);
                flipper.classList.remove('is-flipped');
                
                playerState.view = 'lyrics';
                playerState.lyricIndex = -1;
                playerState.lyrics = [];
                
                if (track.srt) fetchAndParseSRT(track.srt);
                else if (track.lyrics) {
                    playerState.lyrics = track.lyrics;
                    updateLyricsContent();
                } else updateLyricsContent();
                
                updateActivePlaylistItem();
                updateMediaSession(track);
            }

            function playSong() {
                if (!audioPlayer.src || audioPlayer.src.endsWith('index.html')) loadSong(playerState.playlist[playerState.currentIndex]);
                if (!videoPanel.classList.contains('hidden')) showVideoPanel(false);
                audioPlayer.play().catch(e => loadingSpinner.classList.add('hidden'));
            }

            function pauseSong() {
                playerState.isPlaying = false;
                audioPlayer.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                songArtEl.classList.remove('is-visible');
                mainPlayerDiv.classList.remove('is-playing-glow');
                loadingSpinner.classList.add('hidden');
                updateMediaSession(null);
            }

            function nextSong() {
                vibrate();
                playerState.currentIndex++;
                if (playerState.currentIndex > playerState.playlist.length - 1) playerState.currentIndex = 0;
                loadSong(playerState.playlist[playerState.currentIndex]);
                if (playerState.isPlaying) playSong();
            }

            function prevSong() {
                vibrate();
                playerState.currentIndex--;
                if (playerState.currentIndex < 0) playerState.currentIndex = playerState.playlist.length - 1;
                loadSong(playerState.playlist[playerState.currentIndex]);
                if (playerState.isPlaying) playSong();
            }

            function updateProgress() {
                const { duration, currentTime } = audioPlayer;
                if (duration && !isNaN(duration)) {
                    const progressPercent = (currentTime / duration) * 100;
                    progressBar.value = progressPercent;
                    durationTimeEl.textContent = formatTime(duration);
                    currentTimeEl.textContent = formatTime(currentTime);
                }
                updateLyricHighlighting();
            }
            
            function setProgress() {
                const duration = audioPlayer.duration;
                if (duration) audioPlayer.currentTime = (progressBar.value / 100) * duration;
            }

            function formatTime(seconds) {
                if (isNaN(seconds)) return "0:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            function buildCurrentPlaylist() {
                const isDjMode = djModeToggle.checked;
                playerState.playlist = allTracks.filter(track => isDjMode || track.type === 'song');
            }

            function createPlaylist() {
                playlistEl.innerHTML = '';
                playerState.playlist.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.classList.add('playlist-item', 'p-2', 'rounded', 'cursor-pointer', 'hover:bg-gray-700', 'transition', 'flex', 'items-center', 'space-x-3');
                    let artist = artistName;
                    if (track.type === 'dj') {
                        item.classList.add('dj-track');
                        artist = djArtistName;
                    }
                    item.innerHTML = `
                        <img src="${track.image_src}" alt="Art" class="w-10 h-10 rounded object-cover flex-shrink-0">
                        <div class="min-w-0 overflow-hidden">
                            <p class="font-album-title tracking-wider truncate text-sm text-white">${track.title}</p>
                            <p class="track-artist text-xs text-gray-400 truncate">${artist}</p>
                        </div>
                    `;
                    item.addEventListener('click', () => {
                        vibrate();
                        playerState.currentIndex = index;
                        loadSong(track);
                        playSong();
                    });
                    playlistEl.appendChild(item);
                });
            }

            function updateActivePlaylistItem() {
                const items = document.querySelectorAll('#playlist .playlist-item');
                items.forEach((item, index) => {
                    if (index === playerState.currentIndex) {
                        item.classList.add('active');
                        item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else item.classList.remove('active');
                });
            }

            function handleDjToggle() {
                vibrate();
                let currentSrc = null;
                if (playerState.playlist[playerState.currentIndex]) currentSrc = playerState.playlist[playerState.currentIndex].src;
                buildCurrentPlaylist();
                createPlaylist();
                if (currentSrc) {
                    const newIndex = playerState.playlist.findIndex(track => track.src === currentSrc);
                    if (newIndex !== -1) playerState.currentIndex = newIndex;
                    else {
                        pauseSong();
                        playerState.currentIndex = 0;
                        loadSong(playerState.playlist[0]);
                    }
                } else {
                    playerState.currentIndex = 0;
                    loadSong(playerState.playlist[0]);
                }
                updateActivePlaylistItem();
            }

            function showVideoPanel(show, src = "") {
                if (show) {
                    pauseSong(); 
                    videoIframe.src = src + "?autoplay=1&modestbranding=1&rel=0";
                    videoPanel.classList.remove('hidden');
                    flipper.classList.add('hidden'); 
                } else {
                    videoIframe.src = ""; 
                    videoPanel.classList.add('hidden');
                    flipper.classList.remove('hidden'); 
                }
            }

            function createVideoPlaylist() {
                videos.forEach((video) => {
                    const item = document.createElement('div');
                    item.classList.add('playlist-item', 'p-2', 'rounded', 'cursor-pointer', 'hover:bg-gray-700', 'transition', 'flex', 'items-center', 'space-x-3');
                    item.innerHTML = `
                        <img src="${video.image_src}" alt="Art" class="w-10 h-10 rounded object-cover flex-shrink-0">
                        <div class="min-w-0">
                            <p class="font-album-title tracking-wider truncate text-sm text-white">${video.title}</p>
                            <p class="text-xs text-gray-400">Music Video</p>
                        </div>
                    `;
                    item.addEventListener('click', () => {
                        vibrate();
                        showVideoPanel(true, video.src);
                    });
                    videoPlaylistEl.appendChild(item);
                });
            }

            function srtTimeToSeconds(timecode) {
                const parts = timecode.split(':');
                const secondsParts = parts[2].split(',');
                return (parseInt(parts[0]) * 3600) + (parseInt(parts[1]) * 60) + parseInt(secondsParts[0]) + (parseInt(secondsParts[1]) / 1000);
            }

            function parseSRT(srtText) {
                const lines = [];
                const blocks = srtText.trim().split('\n\n');
                for (const block of blocks) {
                    const blockLines = block.split('\n');
                    if (blockLines.length >= 3) {
                        try {
                            const timecode = blockLines[1].split(' --> ');
                            lines.push({ 
                                start: srtTimeToSeconds(timecode[0].trim()), 
                                end: srtTimeToSeconds(timecode[1].trim()), 
                                text: blockLines.slice(2).join(' ').trim() 
                            });
                        } catch (e) {}
                    }
                }
                return lines;
            }

            async function fetchAndParseSRT(srtFile) {
                try {
                    const response = await fetch(srtFile);
                    if (response.ok) {
                        playerState.lyrics = parseSRT(await response.text());
                        updateLyricsContent();
                    }
                } catch (e) { playerState.lyrics = []; updateLyricsContent(); }
            }

            function updateLyricsContent() {
                lyricsContainerEl.innerHTML = '';
                if (playerState.view === 'about') {
                    lyricsContainerEl.innerHTML = `<div class="p-4 text-center">App created by mstonge01.<br>Version ${CURRENT_VERSION}</div>`;
                    return;
                }
                if (playerState.lyrics.length > 0) {
                    const isSRT = playerState.lyrics[0].hasOwnProperty('start');
                    playerState.lyrics.forEach(line => {
                        const el = document.createElement('div');
                        el.classList.add('lyric-line');
                        el.textContent = line.text;
                        if (!isSRT) el.style.opacity = '0.7';
                        lyricsContainerEl.appendChild(el);
                    });
                } else {
                    const msg = playerState.playlist[playerState.currentIndex]?.type === 'dj' ? "DJ Mode Active" : "No lyrics available.";
                    lyricsContainerEl.innerHTML = `<div class="lyric-line" style="opacity: 0.7;">${msg}</div>`;
                }
            }

            function updateLyricHighlighting() {
                if (!playerState.lyrics || !playerState.lyrics.length || !playerState.lyrics[0].start) return;
                const currentTime = audioPlayer.currentTime;
                const newIndex = playerState.lyrics.findIndex(l => currentTime >= l.start && currentTime < l.end);
                if (newIndex !== -1 && newIndex !== playerState.lyricIndex) {
                    playerState.lyricIndex = newIndex;
                    document.querySelectorAll('.lyric-line').forEach((line, i) => {
                        if (i === playerState.lyricIndex) {
                            line.classList.add('active-lyric');
                            line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        } else line.classList.remove('active-lyric');
                    });
                }
            }

            function updateMediaSession(track) {
                if ('mediaSession' in navigator && track) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: track.title,
                        artist: track.type === 'dj' ? djArtistName : artistName,
                        album: albumName,
                        artwork: [{ src: track.image_src, sizes: '512x512', type: 'image/png' }]
                    });
                }
            }

            enterBtn.addEventListener('click', startVideoTransition);
            skipIntroBtn.addEventListener('click', skipIntro);
            splashVideo.addEventListener('ended', () => { if(playerState.hasInteracted) introAudio.play().catch(e => transitionToPlayer()); });
            introAudio.addEventListener('ended', transitionToPlayer);
            
            playPauseBtn.addEventListener('click', () => {
                vibrate();
                playerState.isPlaying ? pauseSong() : playSong();
            });
            prevBtn.addEventListener('click', prevSong);
            nextBtn.addEventListener('click', nextSong);
            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('ended', nextSong);
            progressBar.addEventListener('input', setProgress);
            
            lyricsBtn.addEventListener('click', () => {
                vibrate();
                if (playerState.view === 'about') { playerState.view = 'lyrics'; updateLyricsContent(); }
                else if (!flipper.classList.contains('is-flipped')) { playerState.view = 'lyrics'; updateLyricsContent(); }
                flipper.classList.toggle('is-flipped');
            });
            aboutBtn.addEventListener('click', () => { 
                vibrate();
                playerState.view = 'about'; 
                updateLyricsContent(); 
                flipper.classList.add('is-flipped'); 
            });
            
            audioTab.addEventListener('click', () => {
                vibrate();
                playlistEl.classList.remove('hidden'); videoPlaylistEl.classList.add('hidden');
                djModeToggle.parentElement.classList.remove('hidden');
                audioTab.classList.replace('bg-transparent', 'bg-gray-700'); audioTab.classList.replace('text-gray-500', 'text-white');
                videoTab.classList.replace('bg-gray-700', 'bg-transparent'); videoTab.classList.replace('text-white', 'text-gray-500');
            });
            videoTab.addEventListener('click', () => {
                vibrate();
                playlistEl.classList.add('hidden'); videoPlaylistEl.classList.remove('hidden');
                djModeToggle.parentElement.classList.add('hidden');
                videoTab.classList.replace('bg-transparent', 'bg-gray-700'); videoTab.classList.replace('text-gray-500', 'text-white');
                audioTab.classList.replace('bg-gray-700', 'bg-transparent'); audioTab.classList.replace('text-white', 'text-gray-500');
            });
            djModeToggle.addEventListener('change', handleDjToggle);

            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', playSong);
                navigator.mediaSession.setActionHandler('pause', pauseSong);
                navigator.mediaSession.setActionHandler('previoustrack', prevSong);
                navigator.mediaSession.setActionHandler('nexttrack', nextSong);
            }

            buildCurrentPlaylist();
            createPlaylist();
            createVideoPlaylist();
            loadSong(playerState.playlist[0]);
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Failed', err));
            }
        });
    </script>
</body>
</html>
